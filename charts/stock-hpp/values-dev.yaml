# Dev overrides only. Image tags here are bumped automatically by CI's
# bump-dev job (yq eval -i on this file) after every merge to main in
# stock-backend/stock-frontend — see docs/adr/0002-gitops-deployment-architecture.md.
#
# Placeholder hostnames below (`.dev.lan`) assume the k3s box resolves via
# local DNS/hosts-file entries on the homelab network; swap for the real
# hostname once one is chosen.

backend:
  image:
    tag: 375c429902517d5dab0340d52332a61acb3b84de
  env:
    CORS_ORIGINS: "http://stock-hpp.dev.lan,https://stock-hpp.dev.lan"
frontend:
  image:
    tag: e4cf23cc1c7cb14e173146ff668ef1fa7236566b
  config:
    # Protocol-relative (no scheme), and no /api/v1 -- client.ts appends its
    # own "/api/v1" prefix, and browsers that auto-upgrade http:// page
    # loads to https:// (Chrome's HTTPS-First Mode, HSTS, etc.) would
    # otherwise block this as mixed content since it's a hardcoded http://
    # call from an https:// page. "//host" lets the browser resolve the
    # scheme from whatever the page itself was loaded with.
    apiBaseUrl: "//stock-hpp.dev.lan"
postgres:
  image:
    tag: 375c429902517d5dab0340d52332a61acb3b84de
ingress:
  host: stock-hpp.dev.lan
