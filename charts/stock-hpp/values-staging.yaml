# Staging overrides only. Image tags here are bumped by CI's bump-staging
# job, same as dev, but the resulting PR is NOT auto-merged — a human
# promotes staging by hand, and staging-app's Argo CD sync is manual too
# (see docs/adr/0002-gitops-deployment-architecture.md and terraform/environments/staging).

backend:
  image:
    tag: c7ce9a3ef370ff4eca8e8add75679588abd9df81
  env:
    CORS_ORIGINS: "http://stock-hpp.staging.lan,https://stock-hpp.staging.lan"
frontend:
  image:
    tag: 9457fe9a836c380142021b8fffad5969e5ce14f3
  config:
    # Protocol-relative (no scheme), and no /api/v1 -- client.ts appends its
    # own "/api/v1" prefix, and browsers that auto-upgrade http:// page
    # loads to https:// (Chrome's HTTPS-First Mode, HSTS, etc.) would
    # otherwise block this as mixed content since it's a hardcoded http://
    # call from an https:// page. "//host" lets the browser resolve the
    # scheme from whatever the page itself was loaded with.
    apiBaseUrl: "//stock-hpp.staging.lan"
postgres:
  image:
    tag: c7ce9a3ef370ff4eca8e8add75679588abd9df81
ingress:
  host: stock-hpp.staging.lan
