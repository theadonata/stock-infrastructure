# Non-secret backend env vars. DATABASE_URL and JWT_SECRET are deliberately
# not here — they come from the SealedSecret referenced by .Values.secretName
# (see deployment.yaml's secretKeyRef and secrets/<env>/).
# Trivy (KSV-0109, suppressed via the repo-root .trivyignore) flags this ConfigMap
# as holding secrets purely because "ACCESS_TOKEN_EXPIRE_MINUTES" contains
# the word "TOKEN" — it's a plain integer TTL, not a credential. The real
# secrets (DATABASE_URL, JWT_SECRET) are deliberately excluded, per above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stock-hpp.fullname" . }}-backend-config
  labels:
    {{- include "stock-hpp.labels" . | nindent 4 }}
  annotations:
    # The migrate Job (migrate-job.yaml) is a PreSync hook and
    # envFrom's this ConfigMap. Without this, the ConfigMap is a normal
    # Sync-phase resource that doesn't exist yet when the PreSync Job's pod
    # starts, so its container fails with CreateContainerConfigError. Making
    # this a PreSync hook too (one wave earlier) guarantees it exists first.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
data:
  JWT_ALGORITHM: {{ .Values.backend.env.JWT_ALGORITHM | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.backend.env.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
  PROJECT_NAME: {{ .Values.backend.env.PROJECT_NAME | quote }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
