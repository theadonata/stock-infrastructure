apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-hpp.fullname" . }}-frontend
  labels:
    {{- include "stock-hpp.labels" . | nindent 4 }}
    {{- include "stock-hpp.selectorLabels" (dict "component" "frontend" "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "stock-hpp.selectorLabels" (dict "component" "frontend" "Chart" .Chart) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stock-hpp.selectorLabels" (dict "component" "frontend" "Chart" .Chart) | nindent 8 }}
    spec:
      # Matches nginx:alpine's built-in "nginx" user (uid/gid 101) — verified
      # live against the running image, not assumed. fsGroup makes the
      # emptyDirs below group-writable by that uid at mount time.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      # subPath-mounting a single emptyDir-backed file directly over an
      # existing file in the image doesn't work reliably (confirmed live:
      # "error mounting ... not a directory" — kubelet creates the subPath
      # source as the wrong type for a brand-new emptyDir). Instead, copy
      # the whole baked static build into a shared writable emptyDir before
      # nginx starts, and mount that whole directory over
      # /usr/share/nginx/html in the main container — the well-established
      # pattern for a writable path inside an otherwise read-only image.
      initContainers:
        - name: copy-html
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: ["sh", "-c", "cp -r /usr/share/nginx/html/. /dest/"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /dest
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # nginx normally starts as root (to bind :80, create
          # /var/cache/nginx, then drop to the nginx user for workers) --
          # running non-root from PID 1 instead needs NET_BIND_SERVICE to
          # still bind the privileged port 80.
          #
          # Default pid path (/run/nginx.pid) is skipped in favor of /tmp:
          # /run is where Kubernetes automounts the serviceaccount token
          # (verified live: /run/secrets/... exists), and clobbering it with
          # an emptyDir to make it nginx-writable would take that automount
          # out along with it, for no reason this container needs.
          #
          # `args` only, deliberately no `command`: k8s `command` replaces
          # the image's Docker ENTRYPOINT, not just CMD — the image's
          # ENTRYPOINT is /docker-entrypoint.sh, which is what actually runs
          # docker/40-generate-config-js.sh before exec'ing nginx. Setting
          # `command` here would have silently skipped that script entirely.
          args: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            # nginx creates its own client/fastcgi/proxy/scgi/uwsgi temp
            # dirs under here at startup — verified live they're nginx-owned,
            # not baked into the image, so a plain emptyDir is enough.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            # Populated by the copy-html initContainer above — writable, so
            # docker/40-generate-config-js.sh's envsubst step (which runs in
            # this container, before nginx starts) can still generate
            # config.js here same as it always has.
            - name: html
              mountPath: /usr/share/nginx/html
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Consumed by the nginx entrypoint's envsubst step (Fix B) to
            # generate /config.js at container start — same image promotes
            # dev -> staging unchanged, only this env var differs.
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stock-hpp.fullname" . }}-frontend-config
                  key: API_BASE_URL
          # nginx serves static files immediately; there's no DB/backend
          # dependency to wait on, so liveness doubles as readiness here.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: html
          emptyDir: {}
