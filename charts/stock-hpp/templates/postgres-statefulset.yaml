# Single-replica in-cluster Postgres using stock-backend/db/Dockerfile's own
# image (custom initdb scripts) — not a third-party chart/subchart, per
# docs/adr/0002-gitops-deployment-architecture.md's tool-selection
# rationale. StatefulSet (not Deployment) so the pod keeps a stable network
# identity even though there's only one replica; scaling Postgres itself is
# explicitly out of scope (see that same ADR — this is the real ceiling).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stock-hpp.fullname" . }}-postgres
  labels:
    {{- include "stock-hpp.labels" . | nindent 4 }}
  annotations:
    # sync-wave (not a PreSync hook), same wave as postgres-pvc.yaml/
    # postgres-service.yaml — see postgres-pvc.yaml's comment for why this
    # must not be a hook.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ include "stock-hpp.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "stock-hpp.selectorLabels" (dict "component" "postgres" "Chart" .Chart) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stock-hpp.selectorLabels" (dict "component" "postgres" "Chart" .Chart) | nindent 8 }}
    spec:
      # Matches the image's own USER postgres (uid/gid 70, see
      # stock-backend/db/Dockerfile) — verified live, not assumed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          # Same creds the SealedSecret's DATABASE_URL is built from — kept
          # in the same Secret so they can't drift out of sync with each
          # other. See ../../secrets/<env>/backend-secrets.sealed.yaml.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_DB
          # postgres:18+ (see stock-backend/db/Dockerfile) expects a single
          # mount at /var/lib/postgresql, not /var/lib/postgresql/data — the
          # image manages a major-version-specific subdirectory underneath
          # itself for pg_ctlcluster-style upgrades. Mounting at .../data
          # directly makes the image refuse to start with a "PostgreSQL data
          # in an unused mount/volume" error. Confirmed live: CrashLoopBackOff
          # on first real deploy.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # unix_socket_directories (verified live: /var/run/postgresql,
            # holding .s.PGSQL.5432 + its .lock file) isn't under the PVC
            # mount above, so it needs its own writable path once the root
            # fs is read-only.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "stock-hpp.fullname" . }}-postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
