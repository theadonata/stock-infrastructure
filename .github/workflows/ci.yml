name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a Sonar-only config change (or a manual re-check) be re-run without
  # needing a throwaway commit.
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # for SARIF upload — no packages: write, this repo builds/pushes no image

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-fmt:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Runs once, repo-wide, rather than duplicated per environment in the
      # matrix job below — same check either way, one less noisy log.
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # environments are independent; one failing shouldn't hide the others
      matrix:
        # aws-production/aws-dr (STOCK-6) validate fine here even without a
        # live Floci - `terragrunt validate` only checks config/schema, it
        # never calls the provider's configured endpoints.
        environment: [k3s, bootstrap, dev, staging, monitoring, aws-production, aws-dr]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Each environments/<env>/ is now just a terragrunt.hcl (see
      # terraform/README.md) — the real Terraform config it points at
      # (required_providers, resources) lives one level up in
      # terraform/modules/*-environment/. Plain `terraform validate` here
      # would silently succeed on an empty directory and check nothing, so
      # this now runs `terragrunt validate` instead — pinned to the same
      # version used locally (terraform/README.md's "Provider versions").
      # It also generates the same backend.tf as a real run, and Terragrunt
      # always uses a genuinely local backend for the state Terraform
      # touches during `validate` (an ephemeral runner-local file, not the
      # real homelab cluster's state) — same "no real target CI can reach"
      # reasoning the old -backend=false comment described, just satisfied
      # differently.
      - name: Set up Terragrunt
        run: |
          curl -sSL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.3/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terragrunt validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terragrunt validate --non-interactive
