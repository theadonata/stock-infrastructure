name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a Sonar-only config change (or a manual re-check) be re-run without
  # needing a throwaway commit.
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # for SARIF upload — no packages: write, this repo builds/pushes no image

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-fmt:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Runs once, repo-wide, rather than duplicated per environment in the
      # matrix job below — same check either way, one less noisy log.
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # environments are independent; one failing shouldn't hide the others
      matrix:
        environment: [k3s, bootstrap, dev, staging, monitoring]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Each environments/<env>/ is now just a terragrunt.hcl (see
      # terraform/README.md) — the real Terraform config it points at
      # (required_providers, resources) lives one level up in
      # terraform/modules/*-environment/. Plain `terraform validate` here
      # would silently succeed on an empty directory and check nothing, so
      # this now runs `terragrunt validate` instead — pinned to the same
      # version used locally (terraform/README.md's "Provider versions").
      # It also generates the same backend.tf as a real run, and Terragrunt
      # always uses a genuinely local backend for the state Terraform
      # touches during `validate` (an ephemeral runner-local file, not the
      # real homelab cluster's state) — same "no real target CI can reach"
      # reasoning the old -backend=false comment described, just satisfied
      # differently.
      - name: Set up Terragrunt
        run: |
          curl -sSL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.3/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terragrunt validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terragrunt validate --non-interactive

  helm:
    name: Helm lint & template (${{ matrix.overlay }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [dev, staging]
    steps:
      - uses: actions/checkout@v7

      # Pinned explicitly (not the action's default) — the chart's `apiVersion: v2`
      # and the hashicorp/helm provider both require Helm v3; a future default
      # bump to v4 would silently break that assumption.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: helm lint
        run: helm lint charts/stock-hpp -f charts/stock-hpp/values.yaml -f charts/stock-hpp/values-${{ matrix.overlay }}.yaml

      - name: helm template
        run: helm template charts/stock-hpp -f charts/stock-hpp/values.yaml -f charts/stock-hpp/values-${{ matrix.overlay }}.yaml

  helm-monitoring:
    name: Helm lint & template (monitoring)
    runs-on: ubuntu-latest
    # No overlay matrix here — one values.yaml covers both environments (see
    # docs/adr/0003-observability-stack.md), unlike charts/stock-hpp above.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      # Unlike charts/stock-hpp, this chart declares real dependencies
      # (Chart.yaml) — fetch them into charts/monitoring/charts/ before
      # lint/template, same as Argo CD's own repo-server does at sync time.
      # `helm dependency build` resolves Chart.lock's repository URLs
      # against the *local* repo config, not the URLs directly — on a
      # fresh runner with no `helm repo add` yet, it fails with "no
      # repository definition for ...". Confirmed by reproducing this
      # exact failure locally in a clean HELM_CONFIG_HOME.
      - name: helm repo add
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts

      - name: helm dependency build
        run: helm dependency build charts/monitoring

      - name: helm lint
        run: helm lint charts/monitoring -f charts/monitoring/values.yaml

      - name: helm template
        run: helm template charts/monitoring -f charts/monitoring/values.yaml

  shellcheck:
    name: Shellcheck (scripts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          severity: warning # stricter than the action's `error` default — these scripts
          # mutate a live cluster and generate-secrets.sh handles secret material

  dependency-review:
    name: Dependency scanning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  iac-scan:
    name: IaC misconfiguration scan (Trivy, ${{ matrix.scope.category }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Two scoped scans (not one combined scan-ref: .) so unrelated stray
        # files aren't swept in, and each shows up separately in the Security tab.
        scope:
          - { path: terraform, category: terraform }
          - { path: charts, category: helm-chart }
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.scope.path }}
          format: sarif
          output: trivy-results.sarif
          severity: "HIGH,CRITICAL"

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.scope.category }}

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Gates on all lint/validate jobs collectively — there's no single
    # "test" job here the way the sibling app repos have.
    needs: [terraform-validate, helm, helm-monitoring, shellcheck]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
