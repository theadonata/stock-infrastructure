sonar.projectKey=theadonata_stock-infrastructure
sonar.organization=theadonata

# Only directories with real authored logic — bootstrap/ (Markdown runbook)
# and secrets/ (ciphertext SealedSecret CRs) have nothing to scan.
sonar.sources=terraform,charts,scripts

# .terraform/ and *.tfstate* are gitignored but excluded here too in case a
# local scanner run picks up artifacts left on disk. secrets/*.sealed.yaml
# is ciphertext only — nothing for static analysis to meaningfully parse.
sonar.exclusions=terraform/**/.terraform/**,terraform/**/*.tfstate,terraform/**/*.tfstate.*,secrets/**/*.sealed.yaml
