---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: stock-hpp-backend-secrets
  namespace: stock-hpp-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: Never
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  encryptedData:
    DATABASE_URL: 
    JWT_SECRET: 
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: stock-hpp-backend-secrets
      namespace: stock-hpp-dev
