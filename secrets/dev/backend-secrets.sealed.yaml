---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: stock-hpp-backend-secrets
  namespace: stock-hpp-dev
  annotations:
    # Same PreSync ordering fix as backend-configmap.yaml: the migrate Job
    # (PreSync hook) reads DATABASE_URL from the Secret this SealedSecret
    # decrypts to. Without this, it's a normal Sync-phase resource and the
    # decrypted Secret doesn't exist yet when the Job's pod starts.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    DATABASE_URL: 
    JWT_SECRET: 
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: stock-hpp-backend-secrets
      namespace: stock-hpp-dev
